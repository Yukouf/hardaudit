<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">HardAudit — architecture réelle</title><desc id="desc">Audit Linux en lecture seule : 9 modules, findings pondérés, score sur 100 et sorties automatisables.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#172033" stroke-width="1"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
 <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif} .title{font-size:28px;font-weight:700;fill:#f8fafc}.sub{font-size:14px;fill:#94a3b8}.name{font-size:16px;font-weight:700;fill:#f8fafc}.detail{font-size:12px;fill:#cbd5e1}.tiny{font-size:11px;fill:#94a3b8}.zone{font-size:11px;font-weight:700;letter-spacing:1.5px}.label{font-size:11px;font-weight:600;fill:#cbd5e1} </style>
</defs>
<rect width="1200" height="720" rx="18" fill="#070b14"/><rect width="1200" height="720" rx="18" fill="url(#grid)" opacity=".65"/>
<circle cx="46" cy="47" r="7" fill="#22d3ee"/><text x="66" y="56" class="title">HardAudit — architecture réelle</text><text x="46" y="84" class="sub">Audit Linux en lecture seule : 9 modules, findings pondérés, score sur 100 et sorties automatisables.</text>

<rect x="35" y="110" width="1130" height="460" rx="16" fill="#0b1220" fill-opacity=".55" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="8 7"/><text x="51" y="135" class="zone" fill="#fb7185">HÔTE LINUX AUDITÉ — aucune modification de configuration</text>
<g filter="url(#shadow)"><rect x="60" y="220" width="185" height="115" rx="12" fill="#0f172a"/><rect x="60" y="220" width="185" height="115" rx="12" fill="#083344" fill-opacity=".42" stroke="#22d3ee" stroke-width="1.7"/></g>
<circle cx="80" cy="243" r="5" fill="#22d3ee"/><text x="94" y="249" class="name">CLI hardaudit</text>
<text x="80" y="272" class="detail">sudo recommandé</text>
<text x="80" y="289" class="detail">--allow-port contextuel</text>
<text x="80" y="306" class="detail">stdlib Python uniquement</text>
<g filter="url(#shadow)"><rect x="300" y="140" width="270" height="285" rx="12" fill="#0f172a"/><rect x="300" y="140" width="270" height="285" rx="12" fill="#064e3b" fill-opacity=".42" stroke="#34d399" stroke-width="1.7"/></g>
<circle cx="320" cy="163" r="5" fill="#34d399"/><text x="334" y="169" class="name">9 modules de collecte</text>
<text x="320" y="192" class="detail">Utilisateurs &amp; sudo / SSH</text>
<text x="320" y="209" class="detail">Réseau / firewall / mises à jour</text>
<text x="320" y="226" class="detail">Kernel / services</text>
<text x="320" y="243" class="detail">Système de fichiers / logs</text>
<g filter="url(#shadow)"><rect x="630" y="170" width="220" height="120" rx="12" fill="#0f172a"/><rect x="630" y="170" width="220" height="120" rx="12" fill="#881337" fill-opacity=".42" stroke="#fb7185" stroke-width="1.7"/></g>
<circle cx="650" cy="193" r="5" fill="#fb7185"/><text x="664" y="199" class="name">Findings pondérés</text>
<text x="650" y="222" class="detail">INFO à CRITICAL</text>
<text x="650" y="239" class="detail">Preuve + commande de contrôle</text>
<text x="650" y="256" class="detail">Références par module</text>
<g filter="url(#shadow)"><rect x="905" y="150" width="210" height="120" rx="12" fill="#0f172a"/><rect x="905" y="150" width="210" height="120" rx="12" fill="#064e3b" fill-opacity=".42" stroke="#34d399" stroke-width="1.7"/></g>
<circle cx="925" cy="173" r="5" fill="#34d399"/><text x="939" y="179" class="name">Score &amp; grade</text>
<text x="925" y="202" class="detail">Somme des 9 modules</text>
<text x="925" y="219" class="detail">A / B / C / D / F</text>
<text x="925" y="236" class="detail">Exit 0 si score ≥ 80</text>
<g filter="url(#shadow)"><rect x="905" y="345" width="210" height="120" rx="12" fill="#0f172a"/><rect x="905" y="345" width="210" height="120" rx="12" fill="#4c1d95" fill-opacity=".42" stroke="#a78bfa" stroke-width="1.7"/></g>
<circle cx="925" cy="368" r="5" fill="#a78bfa"/><text x="939" y="374" class="name">Sorties</text>
<text x="925" y="397" class="detail">Console ANSI</text>
<text x="925" y="414" class="detail">Rapport TXT (-o)</text>
<text x="925" y="431" class="detail">JSON (--json)</text>
<g filter="url(#shadow)"><rect x="630" y="360" width="220" height="90" rx="12" fill="#0f172a"/><rect x="630" y="360" width="220" height="90" rx="12" fill="#1e293b" fill-opacity=".42" stroke="#64748b" stroke-width="1.7"/></g>
<circle cx="650" cy="383" r="5" fill="#64748b"/><text x="664" y="389" class="name">Sources système</text>
<text x="650" y="412" class="detail">/etc, /proc, sysctl</text>
<text x="650" y="429" class="detail">ss/netstat, systemctl</text>
<text x="650" y="446" class="detail">apt, findmnt/mount</text>
<line x1="245" y1="277" x2="300" y2="277" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="243.4" y="258.0" width="58.199999999999996" height="19" rx="8" fill="#070b14"/><text x="272.5" y="272.0" text-anchor="middle" class="label">options</text>
<line x1="570" y1="280" x2="630" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="567.6" y="236.0" width="64.8" height="19" rx="8" fill="#070b14"/><text x="600.0" y="250.0" text-anchor="middle" class="label">constats</text>
<line x1="850" y1="230" x2="905" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="841.8" y="201.0" width="71.4" height="19" rx="8" fill="#070b14"/><text x="877.5" y="215.0" text-anchor="middle" class="label">pénalités</text>
<line x1="1010" y1="270" x2="1010" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="987.5" y="288.5" width="45.0" height="19" rx="8" fill="#070b14"/><text x="1010.0" y="302.5" text-anchor="middle" class="label">rendu</text>
<line x1="630" y1="405" x2="570" y2="405" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="551.1" y="377" width="97.8" height="19" rx="8" fill="#070b14"/><text x="600" y="391" text-anchor="middle" class="label">lecture seule</text>
<circle cx="55" cy="630" r="5" fill="#22d3ee"/><text x="67" y="634" class="tiny">Entrée / UI</text>
<circle cx="225" cy="630" r="5" fill="#34d399"/><text x="237" y="634" class="tiny">Traitement réel</text>
<circle cx="395" cy="630" r="5" fill="#a78bfa"/><text x="407" y="634" class="tiny">Données / sortie</text>
<circle cx="565" cy="630" r="5" fill="#fb7185"/><text x="577" y="634" class="tiny">Sécurité / humain</text>
<circle cx="735" cy="630" r="5" fill="#fbbf24"/><text x="747" y="634" class="tiny">Service externe</text>
<circle cx="905" cy="630" r="5" fill="#64748b"/><text x="917" y="634" class="tiny">Optionnel</text>
</svg>